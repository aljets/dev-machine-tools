  - name: update brew
    homebrew:
      update_homebrew: yes
  - name: install/upgrade brew packages
    homebrew:
      name: "{{ brew_packages }}"
      state: latest
    register: brew_packages_result
  - name: Changed packages
    debug:
      var: brew_packages_result.changed_pkgs
    when: brew_packages_result.changed_pkgs is defined
