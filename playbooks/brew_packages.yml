---
- hosts: all
  tasks:
  - name: update brew
    homebrew:
      update_homebrew: yes
  - name: install missing brew packages
    homebrew:
      name: "{{ brew_packages }}"
      state: present
  - name: list outdated brew packages
    ansible.builtin.shell: >
      brew outdated --json=v2 | jq -r --argjson leaves "$(brew leaves --installed-on-request | jq -R . | jq -s .)"
      '(.formulae[] | select(.name as $n | $leaves | index($n))), .casks[]
      | "\(.name) \(.installed_versions | join(",")) -> \(.current_version)"'
    register: brew_outdated
    changed_when: false
  - name: choose brew upgrades
    pause:
      prompt: |
        {{ brew_outdated.stdout }}

        Upgrade which? (all, space-separated names, or enter to skip)
    register: brew_upgrade_choice
    when: brew_outdated.stdout_lines | length > 0
  - name: upgrade brew packages (no live output, source builds like usql are slow)
    ansible.builtin.command: >
      brew upgrade {{ brew_outdated.stdout_lines | map('split') | map('first') | join(' ')
      if brew_upgrade_choice.user_input == 'all' else brew_upgrade_choice.user_input }}
    environment:
      HOMEBREW_NO_ENV_HINTS: "1"
    register: brew_upgrade_result
    when: brew_upgrade_choice.user_input | default('') | trim | length > 0
  - name: upgraded brew packages
    debug:
      msg: "{{ brew_upgrade_result.stdout_lines | select('match', '^==> Upgrading') | map('regex_replace', '^==> Upgrading ', '') }}"
    when: brew_upgrade_result is changed
