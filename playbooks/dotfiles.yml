---
- hosts: all
  tasks:
  - name: clone repo that is the source of the dotfiles
    # Fails (unfortunately) if local changes
    git:
      repo: "{{ dotfiles_repo }}"
      dest: "{{ dotfiles_repo_dest }}"
      accept_hostkey: yes
  - name: create parent directories for dotfiles
    file:
      path: "{{ item.dest | dirname }}"
      state: directory
    with_items: "{{ dotfiles_files }}"
  - name: symlink dotfiles to location per config mapping
    # Fails (thankfully) if the dotfile exists and is a file
    file:
      src: "{{ dotfiles_repo_dest }}/{{ item.file }}"
      dest: "{{ item.dest }}"
      state: link
    with_items: "{{ dotfiles_files }}"
  # Keys in the repo plist overwrite the app's values; other keys are left alone.
  # Rectangle holds settings in memory, so quit it around the writes.
  - name: apply rectangle settings
    shell: |
      set -e
      plist={{ dotfiles_repo_dest }}/rectangle.plist
      running=$(pgrep -x Rectangle || true)
      if [ -n "$running" ]; then osascript -e 'quit app "Rectangle"'; sleep 1; fi
      for key in $(plutil -convert json -o - "$plist" | jq -r 'keys[]'); do
        defaults write com.knollsoft.Rectangle "$key" "$(plutil -extract "$key" xml1 -o - "$plist")"
      done
      if [ -n "$running" ]; then open -a Rectangle; fi
  - name: include private dotfiles vars if present
    include_vars: "{{ claude_extra_vars }}"
    failed_when: false
  - name: create parent directories for private dotfiles
    file:
      path: "{{ item.dest | dirname }}"
      state: directory
    with_items: "{{ private_dotfiles_files }}"
    when: private_dotfiles_files is defined
  - name: write personal git identity included by .gitconfig
    copy:
      dest: "{{ git_personal_config_dest }}"
      force: no
      content: |
        [user]
            name = {{ git_personal_name }}
            email = {{ git_personal_email }}
    when: git_personal_email is defined
  - name: symlink private dotfiles
    file:
      src: "{{ item.file }}"
      dest: "{{ item.dest }}"
      state: link
    with_items: "{{ private_dotfiles_files }}"
    when: private_dotfiles_files is defined
