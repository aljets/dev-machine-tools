# Ansible brew cask stuff has some issues, so just do it myself
---
- hosts: all
  tasks:
  - name: list installed brew formulae and casks
    ansible.builtin.shell: brew list -1 --formula; brew list -1 --cask
    register: brew_installed
    changed_when: false
  - name: Install brew casks
    register: install_output
    ansible.builtin.shell:
      cmd: |
        {{ ('brew tap ' + item.repo) if item.repo is defined }}
        {{ ('brew trust ' + ('--formula ' if item.cask is defined and not item.cask else '--cask ') + (item.repo | replace('homebrew-', '')) + '/' + item.package) if item.repo is defined }}
        brew install {{ '' if item.cask is defined and not item.cask else '--cask ' }}{{ item.package }}
    changed_when: install_output.rc == 0
    failed_when: install_output.rc != 0 and 'already an App at' not in install_output.stderr
    loop: "{{ brew_cask_packages | rejectattr('package', 'in', brew_installed.stdout_lines) }}"
